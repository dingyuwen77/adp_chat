# 复制为 adp_chat/config.toml。真实 AppKey 不提交 Git。
[adp]
app_key = ""
user_id = "local_adp_user"
visitor_id = ""
user_name = ""

[chat]
chat_timeout_seconds = 180
incremental = true
streaming_throttle = 0
system_role = ""
search_network = ""
workflow_status = ""
detect_text_clarification = false
structured_interaction = false

[session]
# 路径相对于 adp_chat/config.toml 所在目录。
session_file = "../runtime/session.json"

[logging]
log_enabled = true
log_level = "INFO"
log_file = "../logs/adp_chat.log"
log_max_bytes = 5242880
log_backup_count = 3
log_question = false
log_answer_chars = 0
