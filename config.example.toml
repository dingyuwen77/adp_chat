# 本文件与 config.toml 保持相同的配置项、顺序和注释，仅配置值允许不同。
# 真实凭据和环境值填写在 config.toml；示例不放真实凭据，实际文件不提交 Git。
# main.py、adp-chat 和 FastAPI 共用同一套单轮对话配置。

[adp]
# 必填：在已发布 ADP 应用 API 接入页复制 AppKey，不是腾讯云 SecretKey。
app_key = ""
# 必填：用户的稳定标识；同一用户保持不变，修改后需显式创建新会话。
user_id = "local_adp_test_user_001"
# 可选访问者标识：留空自动使用 user_id，通常无需填写。
visitor_id = ""
# 可选用户名称：留空不发送 UserName。
user_name = "本地API测试"

[chat]
# ADP 文本输出开关：false 非流式（默认），true 流式；两种模式都使用 SSE。
# 仅控制上游 ADP；main/CLI/FastAPI 仍等待本轮完成后一次输出正式结果。
stream = false
# 单轮读取超时，单位秒，必须为正数；超时不会自动重试。
chat_timeout_seconds = 180
# 仅 stream=true 时发送：每积攒多少字符回包一次；0 使用平台默认。
streaming_throttle = 0
# 可选系统角色；留空沿用应用角色，不需要覆盖时勿填写。
system_role = ""
# 联网搜索："" 沿用应用设置，"enable" 开启，"disable" 关闭。
search_network = ""
# 工作流过程状态："" 沿用应用设置，"enable" 开启，"disable" 关闭。
workflow_status = ""
# 多意图开关：省略沿用平台设置；需要覆盖时取消注释。
# enable_multi_intent = true

[session]
# 三种默认入口共用的会话路径；相对路径基于本配置目录，不支持多进程同时使用。
# 同应用同用户复用；切换身份时使用独立路径或运行 --new-session。
session_file = "runtime/session.json"

[wecom]
# 企业微信身份作用域；不用网关时可保留空值/0。
# 配置时三项必须同时填写；仅为派生作用域，不代表真实企微身份已验证。
corp_id = ""
agent_id = 0
# 固定逻辑应用名，不能用可轮换 AppKey；上线后不要静默修改。
adp_application = ""
# 默认关闭；启用后异步调用ADP，通知由下方模式独立控制。
gateway_enabled = false
# 企业微信对外回调完整URL；复制同一值到后台，修改后重启应用并同步后台。
# 启动按URL路径注册GET/POST；主机/端口仍由deployment及网络转发决定，不自动配置后台。
# 留空兼容/wecom/callback；非空须为HTTP(S)静态路径，不含查询、片段或API保留路径。
callback_url = ""
# 企业微信后台“接收消息”的 Token；英文或数字，不超过32位，须与后台一致。
# A～E使用独立测试值，F填写正式回调值；它不是应用Secret或access_token。
callback_token = ""
# 企业微信后台生成的43位 EncodingAESKey；须与后台一致，不提交Git。
encoding_aes_key = ""
# 相对路径基于本配置目录，与旧单用户 session_file 分开；生产使用新的独立目录。
messages_dir = "runtime/messages"
# 物理接收保护，不是 ADP 模型业务并发配额；触发时拒绝成功 ACK。
callback_max_bytes = 65536
max_unfinished_messages = 2000
# Python调用ADP的出站地址，与企业微信入站回调选择HTTP/HTTPS无关。
# 正式ADP固定使用HTTPS；仅本机Fake可覆盖为 http://127.0.0.1:8765/adp/v2/chat。
adp_url = "https://wss.lke.cloud.tencent.com/adp/v2/chat"
# 整条SSE的物理字节保护，超出则UNKNOWN，不自动重试。
adp_response_max_bytes = 1048576
# disabled不发送；simulated仅模拟；wecom调用真实企业微信应用消息接口。
# A～E使用simulated且只能记SEND_SIMULATED；F真实发送另需production与应用Secret。
notification_mode = "disabled"
# test用于本地验证，production用于正式接入；禁止把已有测试状态目录直接切成production。
gateway_environment = "test"
# 自建应用详情页的Secret，填在实际配置；A～E保持空值，不提交Git。
# access_token由发送器用CorpID和本Secret自动获取、缓存，无须手工增加配置项。
wecom_app_secret = ""
# 一次通知的总超时（含Token与全部文字分片），不影响ADP用户占用。
send_timeout_seconds = 15

[logging]
# true 写本地日志；false 不创建日志。问答可能含业务信息，请按需关闭。
log_enabled = true
# 级别：DEBUG/INFO/WARNING/ERROR/CRITICAL；一般用 INFO，排障用 DEBUG。
log_level = "DEBUG"
# 日志路径：相对路径基于本配置目录；不输出到控制台。
log_file = "logs/adp_chat.log"
# 单份日志轮转阈值，单位字节，必须为正数；默认约 5 MiB。
log_max_bytes = 5242880
# 轮转备份份数，至少 1；默认保留 3 份旧日志。
log_backup_count = 3
# 历史兼容字段：独立JSONL已停用，本字段暂保留以兼容既有配置，不再控制.log轮转。
# 统一日志使用log_max_bytes/log_backup_count；后续接入Cosmos DB前需设计采集检查点与保留策略。
events_retention_days = 14
# true 记录脱敏后的用户问题；false 不记录问题正文。
log_question = true
# 回答脱敏后最多记录的 Unicode 字符数；0 不记录回答正文，与问题开关独立。
log_answer_chars = 100

[deployment]
# 仅服务器 run.sh/upgrade.sh 读取；本地 CLI、直接 Uvicorn 和源码 Compose 忽略。
# 更换服务器时在此配置宿主监听IPv4，不需要因IP不同修改源码或脚本。
# 使用本机网卡IP或0.0.0.0；容器内部仍固定监听0.0.0.0:8000。
# 它不是企业微信后台的回调URL，也不一定等于调用企业微信时的公网出口IP。
bind_ip = "10.102.70.82"
# 服务器对外发布的端口，必须为 1 至 65535 的整数。
# 常规部署只改本节即可；若手工设置ADP_BIND_IP/ADP_HOST_PORT，会覆盖对应字段。
host_port = 4560
